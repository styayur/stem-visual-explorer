[package]
name = "stem-visual-explorer"
version = "0.1.0"
description = "STEM Visual Explorer - visual search for mathematics and physics"
authors = ["Yur Stya <yurstya@gmail.com>"]
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.77"

[lib]
name = "stem_visual_explorer_lib"
crate-type = ["rlib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = [], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli", "deflate"] }
scraper = "0.20"
url = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
thiserror = "1"
async-trait = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
open = { version = "5", optional = true }
log = "0.4"

[features]
default = ["tauri"]
tauri = ["dep:tauri", "dep:open", "dep:tauri-build"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
