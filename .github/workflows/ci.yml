name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (type-check + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Unit tests (search + translation logic)
        run: npm test
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Browser regression tests
        run: npm run test:web
      - name: Pages build smoke test
        run: npm run test:web:build

  desktop:
    name: Windows desktop compile
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run build
      - name: Check Tauri windows and commands
        working-directory: src-tauri
        run: cargo check --locked

  core:
    name: Core logic (Rust tests + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format check
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Lint pure logic
        working-directory: src-tauri
        run: cargo clippy --no-default-features --all-targets -- -D warnings
      - name: Parser / query / ranking tests
        working-directory: src-tauri
        run: cargo test --no-default-features

  retrieval:
    name: Retrieval quality and TS/Rust parity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run ontology:validate
      - run: npm run index:quality
      - run: npm run benchmark
      - run: npm run test:parity
      - name: Retain retrieval measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-quality
          path: |
            artifacts/retrieval-benchmark*.json
            artifacts/provider-quality.json
            artifacts/ontology-statistics.json
