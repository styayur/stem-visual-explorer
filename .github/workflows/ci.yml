name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (type-check + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Unit tests (search + translation logic)
        run: node --experimental-strip-types scripts/unit_test.mjs

  core:
    name: Core logic (Rust tests + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format check
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Lint pure logic
        working-directory: src-tauri
        run: cargo clippy --no-default-features --all-targets -- -D warnings
      - name: Parser / query / ranking tests
        working-directory: src-tauri
        run: cargo test --no-default-features