name: Bug report
description: Report a reproducible search, preview, translation, or desktop problem.
title: '[Bug]: '
body:
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v0.2.0
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - GitHub Pages web version
        - Windows desktop version
        - Provider/index refresh
        - Shared search or concept logic
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and browser/WebView2 version
      placeholder: Windows 11; WebView2 141 / Chrome 141
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include the query, enabled providers, filters, selected result, and exact action.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs or screenshots
      description: Remove account data, private history, cookies, local paths, and unrelated browsing data.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private history, cookies, local paths, and personal data.
          required: true
        - label: This is not a security vulnerability. I will follow SECURITY.md for security reports.
          required: true
